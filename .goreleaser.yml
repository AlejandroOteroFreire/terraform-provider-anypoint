# Goreleaser config for terraform-provider-anypoint
# Distribution: GitHub Releases (NOT Terraform Registry).
# Users install manually via `provider_installation` block — see README.

# To re-enable Terraform Registry publishing, uncomment the `signs:` block below
# and set the GPG_FINGERPRINT env var in CI.

version: 2

# All modified Go client code lives under `internal/clients/` inside this repo,
# so we have no local-path replace directives. `go mod download` resolves
# everything from the module proxy.
before:
  hooks:
    - go mod download

builds:
  - env:
      # CGO disabled so binaries work in restricted CI envs (Terraform Cloud, etc.)
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      # darwin 386 doesn't exist
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]   # goreleaser v2 plural
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# Uncomment the section below if you ever publish to the public Terraform Registry.
# Requires GPG_FINGERPRINT env var with a key registered at registry.terraform.io.
#
# signs:
#   - artifacts: checksum
#     args:
#       - "--batch"
#       - "--local-user"
#       - "{{ .Env.GPG_FINGERPRINT }}"
#       - "--output"
#       - "${signature}"
#       - "--detach-sign"
#       - "${artifact}"

release:
  # Set to true to manually review the GitHub release before publishing
  draft: false
  # Use the CHANGELOG.md section that matches the tag as release notes
  # (requires the tag matching a `## [X.Y.Z]` heading)
  prerelease: auto

changelog:
  disable: true
